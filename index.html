var(--amber);padding:3px 3px 0}.visit{font-size:10px;background:transparent;border:0;padding:3px 2px;color:var(--green);text-align:left}.sat-title{display:block;font-size:11px;font-weight:600;margin:0 0 5px}.abs-row td{height:66px}.absence{display:block;width:100%;margin-bottom:4px;padding:4px;text-align:left;font-size:10px;background:#f9f2e3;border-color:#efe1c2}.absence.leave{background:#f1edf8;border-color:#e9dff3}.absence.sick{background:#faeeeb;border-color:#f0dcd8}.add-absence{border:0;background:transparent;color:var(--muted);padding:3px 5px;font-size:11px}.legend{display:flex;gap:13px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 15px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px;background:#b6cdb9}.dot.folga{background:#dfbd83}.dot.ferias{background:#c4b2e5}.dot.baixa{background:#e8b1a7}

<body>
<header class="topbar">
<div class="brand"><span class="mark" aria-hidden="true">▦</span><div><strong>Escala SAD</strong><span class="quiet small">Serviço de Apoio Domiciliário</span></div></div>
<nav class="tabs" aria-label="Áreas da aplicação" id="tabs"></nav>
<div class="topright"><span id="save-state" class="saved" role="status">A abrir dados locais</span><button class="ghost" data-action="backup">Cópia de segurança</button></div>
</header>
<main id="app"></main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div class="toast" role="status" id="toast" hidden></div>
<script>
'use strict';
const routes = ['Famalicão','Raposos','Nazaré'];
const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const sections = ['Calendário','Equipa','Rotas','Resumo mensal'];
const types = {folga:'Folga compensatória',ferias:'Férias',baixa:'Baixa médica'};
const names = ['Leonor A','Beatriz B','Mariana C','Inês D','Sofia E','Rita F','Clara G','Alice H','Diana I'];
const people = names.map((_,i)=>i);
const seedCycle = [1,3,0,2,4,1,2,4,0];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.toISOString().slice(0,10);
const localDay = () => {const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const add = (d,n) => iso(new Date(Date.parse(d)+n*86400000));
const diff = (a,b) => Math.round((Date.parse(a)-Date.parse(b))/86400000);
const weekday = d => (new Date(d).getUTCDay()+6)%7;
const monday = d => add(d,-weekday(d));
const format = (d, options) => new Intl.DateTimeFormat('pt-PT',{...options,timeZone:'UTC'}).format(new Date(d));
const fullDate = d => format(d,{weekday:'long',day:'numeric',month:'long'});
const shortDate = d => format(d,{day:'numeric',month:'short'});
function weekLabel(first,last) {
  const month = d => format(d,{month:'long'});
  const start = Number(first.slice(-2)), end = Number(last.slice(-2));
  if(first.slice(0,7)===last.slice(0,7)) return start+'–'+end+' de '+month(last)+' de '+last.slice(0,4);
  const startYear = first.slice(0,4)!==last.slice(0,4)?' de '+first.slice(0,4):'';
  return start+' de '+month(first)+startYear+' – '+end+' de '+month(last)+' de '+last.slice(0,4);
}
const today = localDay();
const anchor = monday(today);
const sample = () => ({
  version:1, anchor, names:[...names], absences:{}, assignments:{}, filledVacancies:{}, folgas:{}, visits:{},
  clients:Array.from({length:30},(_,i)=>({id:i+1,name:'Utente '+pad(i+1),route:Math.floor(i/10),saturday:i%10<5}))
});
const escape = value => String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.querySelector('#app');
const dialog = document.querySelector('#dialog');
const tabs = document.querySelector('#tabs');
let state = sample(), week = anchor, tab = 0, panel = null, activePerson = 0, focusDay = today;
let reportMonth = today.slice(0,7), db, drag, picked, toastTimer, modelCache = null, modalReturn;
const saveLabel = document.querySelector('#save-state');
function shortName(id) {
  const name = (state.names[id]??'').trim();
  if (!name || name==='Sem nome') return 'Sem nome';
  const words = name.split(/\s+/);
  return words[0]+(words.length>1?' '+words[1][0].toUpperCase()+'.':'');
}
function openStore() {
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open('escala-sad-local',1);
    request.onupgradeneeded = () => request.result.createObjectStore('data');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function readState() {
  return new Promise((resolve,reject)=>{
    const request = db.transaction('data').objectStore('data').get('state');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function save() {
  modelCache = null;
  if (!db) {saveLabel.textContent='Gravação indisponível'; return;}
  try {
    const tx = db.transaction('data','readwrite');
    tx.objectStore('data').put(state,'state');
    saveLabel.textContent='A guardar…';
    tx.oncomplete = () => {saveLabel.textContent='Guardado neste navegador';};
    tx.onerror = tx.onabort = () => {saveLabel.textContent='Falha ao guardar';};
  } catch {saveLabel.textContent='Falha ao guardar';}
}
function easter(year) {
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const j=Math.floor(c/4),k=c%4,l=(32+2*e+2*j-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const n=h+l-7*m+114;
  return year+'-'+pad(Math.floor(n/31))+'-'+pad(n%31+1);
}
function holiday(date) {
  const fixed = {'01-01':'Ano Novo','04-25':'25 de Abril','05-01':'Dia do Trabalhador','06-10':'Dia de Portugal','08-15':'Assunção','10-05':'Implantação da República','11-01':'Todos os Santos','12-01':'Restauração da Independência','12-08':'Imaculada Conceição','12-25':'Natal'};
  const easterOffset = diff(date,easter(Number(date.slice(0,4))));
  return fixed[date.slice(5)] || ({'-2':'Sexta-feira Santa','0':'Páscoa','60':'Corpo de Deus'})[easterOffset] || '';
}
function plannedWeek(start) {
  const number = Math.round(diff(start,state.anchor)/7);
  const mod = (n,m) => ((n%m)+m)%m;
  const stride = [1,2,4,5][mod(Math.floor(number/3),4)];
  return people.map(i=>mod(number+stride*i,9));
}
const manualType = (date,person) => state.absences[date]?.[person];
function makeModel(target,startHint=week) {
  if (modelCache?.target===target && modelCache.startHint===startHint) return modelCache;
  const earliest = [state.anchor,target,startHint,...Object.keys(state.absences),...Object.keys(state.assignments)].sort()[0];
  const from = monday(earliest);
  const roster={}, absence={}, ledger=[], queue=[];
  const cycle = [...seedCycle];
  let previous = [], next = 0;
  for (let start=from; start<=target; start=add(start,7)) {
    if(start===state.anchor) {previous=[];next=0;queue.length=0;cycle.splice(0,cycle.length,...seedCycle);}
    const base = plannedWeek(start);
    for (let offset=0;offset<7;offset++) {
      const date=add(start,offset);
      absence[date]=Object.fromEntries(Object.entries(state.absences[date]||{}).map(([id,type])=>[id,{type}]));
      if (offset<5) roster[date]=state.assignments[date]||base;
      else if (offset===6) roster[date]=[];
    }
    const due = queue.filter(item=>!item.date && item.eligible<=start).sort((a,b)=>a.saturday.localeCompare(b.saturday));
    for (const item of due) {
      const preferred = add(start,cycle[item.person]);
      const override = state.folgas[item.key];
      const date = override?.slice(0,10) || preferred;
      if (date<start || date>add(start,4)) continue;
      const entries = absence[date];
      if (entries[item.person] || Object.keys(entries).length>=3) continue;
      entries[item.person] = {type:'folga',key:item.key};
      item.date=date;
      if (date===preferred) cycle[item.person]=(cycle[item.person]+1)%5;
    }
    const sat=add(start,5);
    const ordered=people.map(i=>(next+i)%9);
    const fresh=ordered.filter(person=>!previous.includes(person) && !manualType(sat,person));
    const repeated=ordered.filter(person=>previous.includes(person) && !manualType(sat,person));
    const hasSick=people.some(person=>manualType(sat,person)==='baixa');
    const predicted=[...fresh,...(hasSick?repeated:[])].slice(0,4);
    const rest=ordered.filter(person=>!predicted.includes(person));
    const slots=[...predicted,...Array(Math.max(0,4-predicted.length)).fill(null),...rest];
    roster[sat]=state.assignments[sat]||slots;
    previous=roster[sat].slice(0,4).filter(person=>person!==null&&!absence[sat][person]);
    if (previous.length) next=(previous.at(-1)+1)%9;
    for (const person of previous) {
      const item={key:sat+'|'+person,person,saturday:sat,eligible:add(start,7),date:null};
      ledger.push(item);
      queue.push(item);
    }
  }
  modelCache={target,startHint,roster,absence,ledger};
  return modelCache;
}
const viewModel = () => makeModel([add(week,6),add(monday(today),6)].sort().at(-1));
function balance(person,year) {
  const reserved=Object.entries(state.absences).filter(([d,entries])=>d.startsWith(year+'-')&&entries[person]==='ferias').length;
  return 22-reserved;
}
function pendingCount(model,id,through) {
  return model.ledger.filter(item=>item.person===id&&item.saturday<=through&&(!item.date||item.date>through)).length;
}
function summary(model,id,month,through=add(today,0)) {
  let work=0,saturdays=0,holidays=0,off=0,sick=0;
  for (const [date,slots] of Object.entries(model.roster)) {
    if (!date.startsWith(month)||date>through) continue;
    const tag=model.absence[date]?.[id]?.type;
    if (tag==='folga') off++;
    if (tag==='baixa') sick++;
    if (tag) continue;
    const worked=weekday(date)<5?slots.includes(id):weekday(date)===5&&slots.slice(0,4).includes(id);
    if (worked) {
      work++;
      if (weekday(date)===5) saturdays++;
      if (holiday(date)) holidays++;
    }
  }
  return {work,saturdays,holidays,off,sick};
}
function saturdayVisits(date) {
  const clients=state.clients.filter(client=>client.saturday).sort((a,b)=>a.route-b.route||a.id-b.id);
  const split=Math.ceil(clients.length/2);
  return clients.map((client,i)=>({...client,team:state.visits[date]?.[client.id]??(i<split?0:1)}));
}
function notify(message) {
  const box=document.querySelector('#toast');
  box.textContent=message; box.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{box.hidden=true;},3600);
}
function header(title,description,actions='') {
  return '<div class="heading"><div><h1>'+title+'</h1>'+ (description?'<p>'+description+'</p>':'')+'</div><div class="actions">'+actions+'</div></div>';
}
function personButton(id,attrs,cls='') {
  return '<button class="person '+cls+'" type="button" draggable="false" data-person="'+id+'" '+attrs+'><span>'+escape(shortName(id))+'</span><span class="grip" aria-hidden="true">⠿</span></button>';
}
function benchPeople(model) {
  const result=new Set();
  for(let i=0;i<5;i++) {
    const date=add(week,i);
    for(const id of (model.roster[date]||[]).slice(6)) {
      if(id!==null&&!model.absence[date]?.[id]) result.add(id);
    }
  }
  return [...result].sort((a,b)=>a-b);
}
function cellAttributes(date,slot) {
  return 'data-date="'+date+'" data-slot="'+slot+'"';
}
function pair(model,date,num,sat=false) {
  const slots=model.roster[date]||[];
  const start=num*2;

function destination(date,slot) {
  return weekday(date)===5?'Dupla '+(slot<2?'A':'B')+' de sábado':routes[Math.floor(slot/2)];

function baseIndex(date) {return weekday(date)===5?4:6;}
function changePreview(source,dest,scope) {
  const model=viewModel();
  const results=[];
  const last=scope==='week'&&weekday(dest.date)<5?4-weekday(dest.date):0;
  const initialSlots=model.roster[dest.date]||[];
  const current=initialSlots[dest.slot];
  const opposite=current!=null&&!model.absence[dest.date]?.[current]&&current!==source.id?current:null;
  for(let n=0;n<=last;n++) {
    const date=add(dest.date,n);
    const slots=model.roster[date]||[];
    const abs=model.absence[date]||{};
    let from=slots.indexOf(source.id);
    const inBench=from>=baseIndex(date);
    const occupant=slots[dest.slot];
    let reason='';
    if(abs[source.id]) reason=shortName(source.id)+' está de ausência';
    else if(opposite!==null&&abs[opposite]) reason=shortName(opposite)+' está de ausência';
    else if(from===dest.slot) reason='A pessoa já está nesse lugar';
    else if(source.bench&&weekday(date)<5&&!inBench) reason=shortName(source.id)+' tem outra alocação nesse dia';
    else if(!source.bench&&from!==source.slot) reason='A posição de origem é diferente nesse dia';
    else if(opposite!==null&&occupant!==opposite) reason='A posição de destino é diferente nesse dia';
    else if(opposite===null&&occupant!=null&&!abs[occupant]) reason='O destino está ocupado';
    if(reason) {results.push({date,reason});continue;}
    const revised=[...slots];
    if(from<0) {from=revised.length;revised.push(null);}
    revised[from]=occupant??null;
    revised[dest.slot]=source.id;
    const fill=opposite===null?{person:source.id,previous:occupant??null,origin:from}:null;
    results.push({date,slots:revised,fill});
  }
  return {results,opposite};
}

  }

  const title=isSwap?'Trocar '+shortName(source.id)+' e '+shortName(opposite):'Mover '+shortName(source.id);

function resetVacancy(date,slot) {
  const fill=state.filledVacancies?.[date]?.[slot];
  const model=viewModel();
  const slots=[...(model.roster[date]||[])];
  const occupant=slots[slot];
  if(!fill||occupant==null) return;
  const previousStillAbsent=fill.previous===null||Boolean(model.absence[date]?.[fill.previous]);
  if(occupant===fill.person&&previousStillAbsent&&slots[fill.origin]===fill.previous) {
    slots[fill.origin]=occupant;
    slots[slot]=fill.previous;
  } else {
    const open=slots.findIndex((id,index)=>index>=baseIndex(date)&&id===null);
    slots[open<0?slots.length:open]=occupant;
    slots[slot]=null;
  }
  delete state.filledVacancies[date][slot];
  state.assignments[date]=slots;
  save();render();notify('Vaga reposta.');
}

function commitAbsence(form) {
  const key=form.dataset.key;
  const id=Number(form.elements.person.value), type=form.elements.type.value;
  const start=form.elements.start.value, end=form.elements.end?.value||start;
  const message=form.querySelector('#absence-message');
  const problem=text=>{message.textContent=text;};
  if(start>end) return problem('A data final deve ser igual ou posterior à inicial.');
  const lastWeek=add(monday(end),6);
  const model=makeModel([lastWeek,add(week,6)].sort().at(-1));
  if(key) {
    const item=model.ledger.find(entry=>entry.key===key);
    if(!item||start<item.eligible||weekday(start)>4) return problem('Escolhe um dia útil a partir da semana seguinte ao sábado trabalhado.');
    const entries=model.absence[start]||{};
    if(entries[id]&&entries[id].key!==key) return problem('Já existe uma ausência nesse dia.');
    if(Object.keys(entries).filter(person=>entries[person].key!==key).length>=3) return problem('Esse dia ficaria com menos de seis pessoas disponíveis.');
    state.folgas[key]=start;
  } else {
    const dates=[];
    for(let date=start;date<=end;date=add(date,1)) {
      if(type==='ferias'&&(weekday(date)>4||holiday(date))) continue;
      const old=form.dataset.oldDate===date&&Number(form.dataset.oldId)===id;
      if(manualType(date,id)&&!old) return problem('Já existe uma ausência em '+shortDate(date)+'.');
      dates.push(date);
    }
    if(!dates.length) return problem('O período não contém dias de férias a registar.');
    if(type==='ferias') for(const year of new Set(dates.map(date=>date.slice(0,4)))) {
      const existing=form.dataset.oldDate.startsWith(year+'-')&&Number(form.dataset.oldId)===id?1:0;
      if(dates.filter(date=>date.startsWith(year+'-')).length>balance(id,year)+existing) return problem('O saldo de férias de '+year+' é insuficiente.');
    }
    if(form.dataset.oldDate) delete state.absences[form.dataset.oldDate][form.dataset.oldId];
    for(const date of dates) (state.absences[date] ||= {})[id]=type;
  }
  closeModal();save();render();notify('Ausência guardada.');
}

function validBackup(data) {
  const record=value=>value&&typeof value==='object'&&!Array.isArray(value);
  const date=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&iso(new Date(value))===value;
  const person=value=>Number.isInteger(value)&&value>=0&&value<9;
  return data?.version===1&&date(data.anchor)&&weekday(data.anchor)===0&&
    Array.isArray(data.names)&&data.names.length===9&&data.names.every(value=>typeof value==='string')&&
    Array.isArray(data.clients)&&new Set(data.clients.map(client=>client?.id)).size===data.clients.length&&data.clients.every(value=>value&&Number.isInteger(value.id)&&typeof value.name==='string'&&Number.isInteger(value.route)&&value.route>=0&&value.route<3&&typeof value.saturday==='boolean')&&
    record(data.absences)&&Object.entries(data.absences).every(([key,values])=>date(key)&&record(values)&&Object.entries(values).every(([id,type])=>person(Number(id))&&['ferias','baixa'].includes(type)))&&
    record(data.assignments)&&Object.entries(data.assignments).every(([key,values])=>date(key)&&Array.isArray(values)&&values.every(id=>id===null||person(id))&&new Set(values.filter(id=>id!==null)).size===values.filter(id=>id!==null).length)&&
    (data.filledVacancies===undefined||record(data.filledVacancies)&&Object.entries(data.filledVacancies).every(([key,entries])=>date(key)&&record(entries)&&Object.entries(entries).every(([slot,fill])=>/^[0-5]$/.test(slot)&&record(fill)&&person(fill.person)&&(fill.previous===null||person(fill.previous))&&Number.isInteger(fill.origin)&&fill.origin>=0&&fill.origin<16)))&&
    record(data.folgas)&&Object.entries(data.folgas).every(([key,value])=>{const [sat,id]=key.split('|');return date(sat)&&person(Number(id))&&date(value);})&&
    record(data.visits)&&Object.entries(data.visits).every(([key,values])=>date(key)&&record(values)&&Object.values(values).every(group=>group===0||group===1));
}
function backupDialog() {
  modal('Cópia de segurança','<p class="quiet">Exporta a escala e as alterações num ficheiro. Restaurar substitui os dados atuais deste navegador.</p><label class="field">Ficheiro para restaurar<input type="file" id="backup-file" accept=".json,application/json"></label><p id="backup-message" class="notice" role="alert"></p>',
    '<button data-action="backup-export">Exportar cópia</button><button class="primary" data-action="backup-restore">Restaurar cópia</button>');
}
function exportBackup() {
  const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='escala-sad-'+today+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function restoreBackup() {
  const input=dialog.querySelector('#backup-file');
  const message=dialog.querySelector('#backup-message');
  const file=input.files[0];
  if(!file) {message.textContent='Seleciona um ficheiro JSON.';return;}
  try {
    const result=JSON.parse(await file.text());
    if(!validBackup(result)) throw new Error('Invalid backup');
    state=result;save();closeModal();render();notify('Cópia restaurada.');
  } catch {message.textContent='Este ficheiro não é uma cópia válida da Escala SAD.';}
}
function sourceFrom(button) {
  return {id:Number(button.dataset.person),bench:button.dataset.source==='bench',date:button.dataset.date,slot:Number(button.dataset.slot)};
}
function selectSource(button) {
  picked=sourceFrom(button);
  document.querySelector('[aria-pressed=true]')?.removeAttribute('aria-pressed');
  button.setAttribute('aria-pressed','true');
  notify('Seleciona o lugar de destino para '+shortName(picked.id)+'.');
}
const actions={
  tab(button){tab=Number(button.dataset.id);picked=null;render();},
  profile(button){activePerson=Number(button.dataset.id);tab=1;render();},
  'week-prev'(){changeWeek(add(week,-7));},
  'week-next'(){changeWeek(add(week,7));},
  today(){changeWeek(monday(today),today);},
  bench(){panel=panel==='bench'?null:'bench';render();},
  balances(){panel=panel==='saldos'?null:'saldos';render();},
  'panel-close'(){panel=null;picked=null;render();},
  absence(button){const date=button.dataset.date||focusDay;absenceForm(weekday(date)===6?add(date,1):date);},
  'edit-absence'(button){
    const {date,id,key}=button.dataset;
    const entry=viewModel().absence[date]?.[id];
    if(entry) absenceForm(date,Number(id),entry.type,true,key);
  },
  'absence-delete'(button){delete state.absences[button.dataset.date][button.dataset.id];save();closeModal();render();notify('Ausência removida.');},
  visits(button){visitDialog(button.dataset.date,Number(button.dataset.group));},
  'visit-move'(button){
    const {id,date,group}=button.dataset;
    (state.visits[date] ||= {})[id]=1-Number(group);
    save();render();visitDialog(date,Number(group));notify('Visita movida.');
  },
  client(button){clientForm(Number(button.dataset.id));},
  'client-add'(button){clientForm(null,Number(button.dataset.route));},
  'client-delete'(button){
    const id=Number(button.dataset.id);
    state.clients=state.clients.filter(item=>item.id!==id);
    for(const moves of Object.values(state.visits)) delete moves[id];
    save();closeModal();render();notify('Utente removido.');
  },
  'bench-person'(button){selectSource(button);},
  slot(button){
    const date=button.dataset.date,slot=Number(button.dataset.slot);
    focusDay=date;
    if(picked) {const source=picked;picked=null;document.querySelector('[aria-pressed=true]')?.removeAttribute('aria-pressed');moveDialog(source,{date,slot});return;}
    if(button.dataset.person!==undefined) selectSource(button);
    else vacancyDialog(date,slot);
  },
  'reset-vacancy'(button){resetVacancy(button.dataset.date,Number(button.dataset.slot));},
  'confirm-move':confirmMove,
  close:closeModal,
  backup:backupDialog,
  'backup-export':exportBackup,
  'backup-restore':restoreBackup
};
function changeWeek(next,day=next) {
  week=next;focusDay=day;picked=null;render();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');
  if(button) actions[button.dataset.action]?.(button);
});
document.addEventListener('submit',event=>{
  const form=event.target;
  event.preventDefault();
  if(form.id==='profile-form') {
    state.names[activePerson]=form.elements.name.value.trim()||'Sem nome';
    save();render();notify('Nome guardado.');
  } else if(form.id==='absence-form') commitAbsence(form);
  else if(form.id==='vacancy-form') fillVacancy(form);
  else if(form.id==='client-form') {
    const name=form.elements.name.value.trim();
    if(!name) {form.elements.name.focus();return;}
    const route=Number(form.elements.route.value), saturday=form.elements.saturday.checked;
    const item=state.clients.find(client=>client.id===Number(form.dataset.id));
    if(item) Object.assign(item,{name,route,saturday});
    else state.clients.push({id:Math.max(0,...state.clients.map(client=>client.id))+1,name,route,saturday});
    closeModal();save();render();notify('Utente guardado.');
  }
});
document.addEventListener('change',event=>{
  if(event.target.name==='scope') previewMove();
  if(event.target.id==='report-month'&&event.target.value) {reportMonth=event.target.value;render();}
  if(event.target.name==='start') {
    const end=event.target.form.elements.end;
    if(end&&end.value<event.target.value) end.value=event.target.value;
  }
});
document.addEventListener('keydown',event=>{
  if(dialog.open||/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)||event.altKey||event.ctrlKey||event.metaKey) return;
  if(event.key.toLowerCase()==='t'&&tab===0) {event.preventDefault();actions.today();}
  if(event.key==='Escape'&&picked) {
    picked=null;document.querySelector('[aria-pressed=true]')?.removeAttribute('aria-pressed');
  }
});
let gesture, token, cancelClickUntil=0;
document.addEventListener('pointerdown',event=>{
  const button=event.target.closest('.person[data-person]');
  if(!button||event.button!==0) return;
  gesture={button,x:event.clientX,y:event.clientY,pointer:event.pointerId};
});
document.addEventListener('pointermove',event=>{
  if(!gesture||event.pointerId!==gesture.pointer) return;
  if(!drag&&Math.hypot(event.clientX-gesture.x,event.clientY-gesture.y)<6) return;
  if(!drag) {
    picked=null;
    drag=sourceFrom(gesture.button);
    document.querySelector('[aria-pressed=true]')?.removeAttribute('aria-pressed');
    token=document.createElement('div');
    token.className='drag-token';token.textContent=shortName(drag.id);
    document.body.append(token);
    const model=viewModel();
    for(const target of app.querySelectorAll('[data-action=slot]')) {
      const date=target.dataset.date;
      if((drag.bench||drag.date===date)&&!model.absence[date]?.[drag.id]&&Number(target.dataset.person)!==drag.id) target.classList.add('drop-ready');
    }
  }
  token.style.left=(event.clientX+11)+'px';
  token.style.top=(event.clientY+11)+'px';
  app.querySelector('.drop-ready.over')?.classList.remove('over');
  document.elementFromPoint(event.clientX,event.clientY)?.closest('.drop-ready')?.classList.add('over');
});
function clearDrag() {
  drag=null;gesture=null;
  token?.remove();token=null;
  app.querySelectorAll('.drop-ready').forEach(target=>target.classList.remove('drop-ready','over'));
}
document.addEventListener('pointerup',event=>{
  if(!gesture||event.pointerId!==gesture.pointer) return;
  if(!drag) {clearDrag();return;}
  const dest=document.elementFromPoint(event.clientX,event.clientY)?.closest('.drop-ready');
  const origin=drag;
  clearDrag();
  cancelClickUntil=performance.now()+180;
  if(dest) moveDialog(origin,{date:dest.dataset.date,slot:Number(dest.dataset.slot)});
});
document.addEventListener('pointercancel',clearDrag);
document.addEventListener('click',event=>{
  if(performance.now()<cancelClickUntil&&event.detail>0&&!event.target.closest('dialog')) {
    event.preventDefault();event.stopImmediatePropagation();
  }
},true);

async function start() {
  try {
    db=await openStore();
    const saved=await readState();
    if(validBackup(saved)) {state=saved;saveLabel.textContent='Guardado neste navegador';}
    else save();
  } catch {saveLabel.textContent='Gravação indisponível';}
  render();
}
start();
</script>
</body>
